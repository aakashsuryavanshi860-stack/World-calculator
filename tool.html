<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Tool - World Calculators</title>
  <link rel="canonical" href="https://world-calculator.aakashsuryavanshi860.workers.dev/" />
  
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
      --primary: #0f172a; --accent: #2563eb; 
      --text: #334155; --text-light: #64748b;
      --bg: #f8fafc; --border: #e2e8f0; --radius: 12px; 
      --font: 'Segoe UI', Roboto, sans-serif; 
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    body { font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.6; }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    
    .main-header { background: #fff; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .logo span { color: var(--accent); }
    
    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .tool-box { background: #fff; border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .tool-box h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
    
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 5px; }
    .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
    .btn { background: var(--accent); color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    .result-box { display: none; margin-top: 15px; padding: 15px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; text-align: center; }
    
    .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <header class="main-header">
    <a href="index.html" class="logo">World<span>Calculators</span></a>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="tool-box">
      <h1 id="tool-title">Loading...</h1>
      <div id="tool-content"></div>
    </div>
  </div>

  <!-- सभी कैलकुलेटर फाइलें -->

  <script>
    // डेटा इकट्ठा करना
    var allTools = [];
    var allHtmls = {};
    if(typeof tools1 !== 'undefined') { allTools = allTools.concat(tools1); Object.assign(allHtmls, htmls1); }
    if(typeof tools2 !== 'undefined') { allTools = allTools.concat(tools2); Object.assign(allHtmls, htmls2); }
    if(typeof tools3 !== 'undefined') { allTools = allTools.concat(tools3); Object.assign(allHtmls, htmls3); }
    if(typeof tools4 !== 'undefined') { allTools = allTools.concat(tools4); Object.assign(allHtmls, htmls4); }

    if(typeof tools17 !== 'undefined') { allTools = allTools.concat(tools17); Object.assign(allHtmls, htmls17); }
    if(typeof tools18 !== 'undefined') { allTools = allTools.concat(tools18); Object.assign(allHtmls, htmls18); }

    // URL से टूल का नाम निकालें (जैसे ?tool=emi से emi)
    window.addEventListener('load', function() {
      var urlParams = new URLSearchParams(window.location.search);
      var toolId = urlParams.get('tool');
      
      if(!toolId) {
        document.getElementById('tool-title').textContent = "Tool Not Found";
        document.getElementById('tool-content').innerHTML = "<p>Sorry, no tool specified.</p><a href='index.html'>Go to Home</a>";
        return;
      }

      var t = allTools.find(function(x) { return x.id === toolId; });
      if(t) {
        document.getElementById('tool-title').textContent = t.name;
        document.getElementById('tool-content').innerHTML = allHtmls[toolId];
      } else {
        document.getElementById('tool-title').textContent = "Tool Not Found";
        document.getElementById('tool-content').innerHTML = "<p>Sorry, this tool does not exist.</p><a href='index.html'>Go to Home</a>";
      }
    });
  </script>
</body>
</html>
